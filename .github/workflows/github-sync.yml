name: GitHub Repositories Sync (Daily at 2 AM UTC)

on:
  schedule:
    # Runs daily at 2 AM UTC (6 PM PT / 9 PM ET)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force full re-extraction of all repositories'
        type: boolean
        default: false

# Prevent concurrent runs
concurrency:
  group: github-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  extract-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Extract GitHub Repositories
        run: npm run extract:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 🔍 Build Search Index
        run: npm run build:search

      - name: 📊 Generate Statistics
        id: stats
        run: |
          npm run stats > stats.txt || echo "Stats generation skipped"
          echo "stats<<EOF" >> $GITHUB_OUTPUT
          cat stats.txt >> $GITHUB_OUTPUT || echo "No stats available" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📈 Count Changes
        id: changes
        run: |
          CHANGED_FILES=$(git status --porcelain | wc -l)
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

          if [ $CHANGED_FILES -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Found $CHANGED_FILES changed files"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: 💾 Commit Changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'GHL Docs Bot'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A

          # Create detailed commit message
          echo "📦 GitHub repos sync: $(date +'%Y-%m-%d %H:%M UTC')" > commit_msg.txt
          echo "" >> commit_msg.txt
          echo "Extracted from official GoHighLevel GitHub repositories:" >> commit_msg.txt
          echo "- ghl-marketplace-app-template" >> commit_msg.txt
          echo "- ghl-sdk-examples" >> commit_msg.txt
          echo "- highlevel-api-sdk" >> commit_msg.txt
          echo "- flutter-ffmpeg-kit" >> commit_msg.txt
          echo "- naive-ui" >> commit_msg.txt
          echo "- pocketpub" >> commit_msg.txt
          echo "- appengine-local-taskqueue" >> commit_msg.txt
          echo "- hugo-book" >> commit_msg.txt
          echo "" >> commit_msg.txt
          cat stats.txt >> commit_msg.txt || echo "Stats not available" >> commit_msg.txt

          git diff --staged --quiet || git commit -F commit_msg.txt

      - name: 📤 Push to GitHub
        if: steps.changes.outputs.has_changes == 'true'
        run: git push origin main || echo "No changes to push"

      - name: 📋 Summary
        run: |
          echo "## GitHub Repositories Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changed Files:** ${{ steps.changes.outputs.changed_files }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ **Status:** Changes detected and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Status:** No changes detected" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Repositories Monitored" >> $GITHUB_STEP_SUMMARY
          echo "- ghl-marketplace-app-template" >> $GITHUB_STEP_SUMMARY
          echo "- ghl-sdk-examples" >> $GITHUB_STEP_SUMMARY
          echo "- highlevel-api-sdk" >> $GITHUB_STEP_SUMMARY
          echo "- flutter-ffmpeg-kit" >> $GITHUB_STEP_SUMMARY
          echo "- naive-ui" >> $GITHUB_STEP_SUMMARY
          echo "- pocketpub" >> $GITHUB_STEP_SUMMARY
          echo "- appengine-local-taskqueue" >> $GITHUB_STEP_SUMMARY
          echo "- hugo-book" >> $GITHUB_STEP_SUMMARY

      - name: 📋 Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `GitHub repos extraction failed: ${new Date().toISOString().split('T')[0]}`,
              body: `GitHub repositories extraction workflow failed.\n\n[View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'automated', 'github-sync']
            });
