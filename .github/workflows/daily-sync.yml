name: Daily Documentation Sync

on:
  schedule:
    # Runs at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Run full sync instead of incremental'
        type: boolean
        default: false
      source:
        description: 'Specific source to sync'
        type: choice
        options:
          - all
          - help
          - ideas
          - marketplace
          - github
        default: all

# Prevent concurrent runs
concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  extract-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55  # Stay under 60 min for free tier
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          submodules: recursive
          fetch-depth: 0
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: |
          npm ci
          # Install Puppeteer browser
          npx puppeteer browsers install chrome
      
      - name: 🔄 Sync Official GitHub Repos
        if: github.event.inputs.source == null || contains(fromJson('["all", "github"]'), github.event.inputs.source)
        run: npm run sync:github
        continue-on-error: true
      
      - name: 🌐 Extract Help Documentation
        if: github.event.inputs.source == null || contains(fromJson('["all", "help"]'), github.event.inputs.source)
        run: npm run extract:help
        env:
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer
        continue-on-error: true
      
      - name: 💡 Extract Ideas Portal
        if: github.event.inputs.source == null || contains(fromJson('["all", "ideas"]'), github.event.inputs.source)
        run: npm run extract:ideas
        continue-on-error: true
      
      - name: 🛍️ Extract Marketplace Docs
        if: github.event.inputs.source == null || contains(fromJson('["all", "marketplace"]'), github.event.inputs.source)
        run: npm run extract:marketplace
        continue-on-error: true
      
      - name: 🔄 Process Content
        run: npm run process:all
      
      - name: 💾 Update Database
        run: |
          npm run db:update
          npm run db:optimize
      
      - name: 🔍 Build Search Index
        run: |
          npm run build:search
          # Copy to GitHub Pages
          cp -r content/* docs/data/ || true
          cp database/search-index.json docs/data/ || true
      
      - name: 📊 Generate Statistics
        id: stats
        run: |
          npm run stats > stats.txt
          echo "stats<<EOF" >> $GITHUB_OUTPUT
          cat stats.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 💾 Commit Changes
        run: |
          git config --global user.name 'GHL Docs Bot'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          git add -A
          
          # Create detailed commit message
          echo "📚 Daily sync: $(date +'%Y-%m-%d')" > commit_msg.txt
          echo "" >> commit_msg.txt
          cat stats.txt >> commit_msg.txt
          
          git diff --staged --quiet || git commit -F commit_msg.txt
      
      - name: 📤 Push to GitHub
        run: git push origin main || echo "No changes to push"
      
      - name: 🏷️ Create Weekly Release
        if: github.event.schedule
        run: |
          if [ "$(date +%u)" == "1" ]; then
            TAG="v$(date +'%Y.%W')"
            git tag -a $TAG -m "Weekly snapshot: Week $(date +'%W, %Y')"
            git push origin $TAG
            
            gh release create $TAG \
              --title "Week $(date +'%W, %Y') Documentation" \
              --notes-file stats.txt
          else
            echo "Not Monday, skipping weekly release"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📋 Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Extraction failed: ${new Date().toISOString().split('T')[0]}`,
              body: `Extraction workflow failed. [View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'automated']
            });