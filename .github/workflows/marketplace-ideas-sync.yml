name: Marketplace & Ideas Sync (Every 3 Hours)

on:
  schedule:
    # Runs every 3 hours - 8 times per day
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Run full sync instead of incremental'
        type: boolean
        default: false
      source:
        description: 'Specific source to sync'
        type: choice
        options:
          - both
          - marketplace
          - ideas
        default: both

# Prevent concurrent runs
concurrency:
  group: marketplace-ideas-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  extract-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Shorter timeout for non-video extraction

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          submodules: recursive
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm ci

      - name: 🌐 Setup Chrome
        uses: browser-actions/setup-chrome@latest

      - name: 📦 Install Puppeteer Browser
        run: |
          npx puppeteer browsers install chrome || echo "Chrome already available"

      - name: 🔥 Extract Ideas via RSS Feed
        if: github.event.inputs.source == null || contains(fromJson('["both", "ideas"]'), github.event.inputs.source)
        run: npm run extract:ideas
        continue-on-error: true

      - name: 🛍️ Extract Marketplace Docs
        if: github.event.inputs.source == null || contains(fromJson('["both", "marketplace"]'), github.event.inputs.source)
        run: npm run extract:marketplace
        continue-on-error: true

      - name: 🔄 Process Content
        run: npm run process:all

      - name: 💾 Update Database
        run: |
          npm run db:update
          npm run db:optimize

      - name: 🔍 Build Search Index
        run: |
          npm run build:search
          # Copy to GitHub Pages
          cp -r content/* docs/data/ || true
          cp database/search-index.json docs/data/ || true

      - name: 📊 Generate Statistics
        id: stats
        run: |
          npm run stats > stats.txt
          echo "stats<<EOF" >> $GITHUB_OUTPUT
          cat stats.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 💾 Commit Changes
        run: |
          git config --global user.name 'GHL Docs Bot'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A

          # Create detailed commit message
          echo "📚 Marketplace & Ideas sync: $(date +'%Y-%m-%d %H:%M UTC')" > commit_msg.txt
          echo "" >> commit_msg.txt
          cat stats.txt >> commit_msg.txt

          git diff --staged --quiet || git commit -F commit_msg.txt

      - name: 📤 Push to GitHub
        run: git push origin main || echo "No changes to push"

      - name: 📋 Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Marketplace/Ideas extraction failed: ${new Date().toISOString().split('T')[0]}`,
              body: `Marketplace and Ideas extraction workflow failed. [View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'automated']
            });