<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoHighLevel Complete Documentation</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/fuse.js@6.6.2/dist/fuse.min.js"></script>
</head>
<body>
    <header>
        <h1>🚀 GoHighLevel Complete Documentation</h1>
        <p>Comprehensive, searchable archive updated daily</p>
    </header>
    
    <nav>
        <a href="#help">📚 Help</a>
        <a href="#ideas">💡 Ideas</a>
        <a href="#api">🔧 API</a>
        <a href="#marketplace">🛍️ Marketplace</a>
        <a href="https://github.com/YOUR-USERNAME/ghl-complete-docs" target="_blank">📦 GitHub</a>
    </nav>
    
    <main>
        <div class="search-container">
            <input type="text" id="search" placeholder="Search documentation..." autofocus>
            <div class="filters">
                <label><input type="checkbox" class="filter" value="help" checked> Help</label>
                <label><input type="checkbox" class="filter" value="ideas" checked> Ideas</label>
                <label><input type="checkbox" class="filter" value="api" checked> API</label>
                <label><input type="checkbox" class="filter" value="marketplace" checked> Marketplace</label>
            </div>
        </div>
        
        <div id="stats" class="stats">Loading...</div>
        <div id="results" class="results"></div>
    </main>
    
    <script src="search.js"></script>
</body>
</html>
